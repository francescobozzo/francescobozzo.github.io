design:
  theme: engineeringclassic
  page:
    size: us-letter
    top_margin: 2cm
    bottom_margin: 2cm
    left_margin: 2cm
    right_margin: 2cm
    show_footer: false
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 79, 144)
    connections: rgb(0, 79, 144)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    font_family:
      body: Raleway
      name: Raleway
      headline: Raleway
      connections: Raleway
      section_titles: Raleway
    font_size:
      body: 10pt
      name: 30pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.4em
    bold:
      name: false
      headline: false
      connections: false
      section_titles: false
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: left
    photo_width: 3.5cm
    space_below_name: 0.7cm
    space_below_connections: 0.7cm
    connections:
      separator: ''
      show_icons: true
      space_between_connections: 0.5cm
  section_titles:
    type: with_partial_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1.2em
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: true
    short_second_row: false
    degree_width: 1cm
    summary:
      space_left: 0cm
    highlights:
      bullet: '•'
      space_left: 0cm
      space_above: 0.25cm
      space_between_items: 0.25cm
      space_between_bullet_and_text: 0.5em
  templates:
    single_date: MONTH_ABBREVIATION YEAR
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: "**INSTITUTION**, AREA -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
      degree_column: '**DEGREE**'
    normal_entry:
      main_column: "**NAME** -- **LOCATION**\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    experience_entry:
      main_column: "**POSITION**, COMPANY -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE

settings:
  current_date: '2025-08-31'
  bold_keywords: []
  render_command:
    dont_generate_html: true
    dont_generate_markdown: true
    dont_generate_png: true
